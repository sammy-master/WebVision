<!--Q1: Bootstrap Table with Image, Date, and Temperature-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap Table - Weather Forecast</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container mt-4">
        <h4 class="text-center mb-3">6-Day Weather Forecast Table (Bootstrap 5)</h4>
        <table class="table table-bordered table-striped text-center bg-white shadow-sm align-middle">
            <tr>
                <td class="p-3">
                    <p class="fw-semibold mb-2">12 March 2025</p>
                    <img src="https://cdn-icons-png.flaticon.com/128/869/869869.png" width="50" height="50" class="img-fluid my-1" alt="Sunny">
                    <p class="fs-5 fw-bold text-warning mb-0">30°C</p>
                </td>
                <td class="p-3">
                    <p class="fw-semibold mb-2">13 March 2025</p>
                    <img src="https://cdn-icons-png.flaticon.com/128/1163/1163661.png" width="50" height="50" class="img-fluid my-1" alt="Partly Cloudy">
                    <p class="fs-5 fw-bold text-primary mb-0">28°C</p>
                </td>
                <td class="p-3">
                    <p class="fw-semibold mb-2">14 March 2025</p>
                    <img src="https://cdn-icons-png.flaticon.com/128/1163/1163661.png" width="50" height="50" class="img-fluid my-1" alt="Cloudy">
                    <p class="fs-5 fw-bold text-primary mb-0">29°C</p>
                </td>
                <td class="p-3">
                    <p class="fw-semibold mb-2">15 March 2025</p>
                    <img src="https://cdn-icons-png.flaticon.com/128/869/869869.png" width="50" height="50" class="img-fluid my-1" alt="Sunny">
                    <p class="fs-5 fw-bold text-danger mb-0">31°C</p>
                </td>
                <td class="p-3">
                    <p class="fw-semibold mb-2">16 March 2025</p>
                    <img src="https://cdn-icons-png.flaticon.com/128/869/869869.png" width="50" height="50" class="img-fluid my-1" alt="Hot">
                    <p class="fs-5 fw-bold text-danger mb-0">32°C</p>
                </td>
                <td class="p-3">
                    <p class="fw-semibold mb-2">17 March 2025</p>
                    <img src="https://cdn-icons-png.flaticon.com/128/1163/1163657.png" width="50" height="50" class="img-fluid my-1" alt="Breezy">
                    <p class="fs-5 fw-bold text-info mb-0">29°C</p>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
